
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For Shanny 💌</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(135deg, #ffd6e8, #ffecef, #fff5f7);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .background-blur {
      position: absolute;
      width: 600px;
      height: 600px;
      background: rgba(255, 182, 193, 0.3);
      border-radius: 50%;
      filter: blur(120px);
      animation: float 8s ease-in-out infinite;
    }

    .background-blur:nth-child(2) {
      width: 400px;
      height: 400px;
      top: 10%;
      right: 10%;
      background: rgba(255, 255, 255, 0.4);
      animation-delay: 2s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-20px);
      }
    }

    .card {
      position: relative;
      z-index: 2;
      width: 90%;
      max-width: 700px;
      padding: 60px 40px;
      border-radius: 32px;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 8px 40px rgba(255, 105, 180, 0.15);
      text-align: center;
      animation: fadeIn 1.5s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0px);
      }
    }

    .small-text {
      font-size: 14px;
      letter-spacing: 4px;
      color: #d86f93;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      color: #c94f7c;
      margin-bottom: 20px;
      line-height: 1.2;
    }

    p {
      color: #6b4b58;
      font-size: 1.1rem;
      line-height: 1.9;
      margin-bottom: 30px;
    }

    .heart {
      font-size: 2rem;
      animation: heartbeat 1.5s infinite;
      display: inline-block;
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }
      25% {
        transform: scale(1.15);
      }
      50% {
        transform: scale(1);
      }
      75% {
        transform: scale(1.12);
      }
    }

    button {
      border: none;
      padding: 14px 28px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 500;
      background: linear-gradient(135deg, #ff7aa8, #ff96b7);
      color: white;
      cursor: pointer;
      transition: 0.3s ease;
      box-shadow: 0 8px 20px rgba(255, 105, 180, 0.3);
    }

    button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow: 0 12px 24px rgba(255, 105, 180, 0.4);
    }

    .popup {
      margin-top: 25px;
      opacity: 0;
      transition: 0.4s ease;
      color: #b34b72;
      font-size: 1rem;
    }

    .popup.show {
      opacity: 1;
    }

    .floating-hearts span {
      position: absolute;
      bottom: -20px;
      color: rgba(255, 105, 180, 0.5);
      font-size: 20px;
      animation: rise 10s linear infinite;
    }

    .floating-hearts span:nth-child(1) {
      left: 10%;
      animation-duration: 9s;
    }

    .floating-hearts span:nth-child(2) {
      left: 30%;
      animation-duration: 12s;
      font-size: 28px;
    }

    .floating-hearts span:nth-child(3) {
      left: 50%;
      animation-duration: 10s;
    }

    .floating-hearts span:nth-child(4) {
      left: 70%;
      animation-duration: 14s;
      font-size: 24px;
    }

    .floating-hearts span:nth-child(5) {
      left: 85%;
      animation-duration: 11s;
    }

    @keyframes rise {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.4);
        opacity: 0;
      }
    }

    @media(max-width: 600px) {
      .card {
        padding: 40px 24px;
      }

      h1 {
        font-size: 2.2rem;
      }

      p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>

  <div class="background-blur"></div>
  <div class="background-blur"></div>

  <div class="floating-hearts">
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
    <span>❤</span>
  </div>

  <div class="card">
    <div class="small-text">special message only for shanny</div>

    <h1>
      Shanny,<br>
      jangan marah-marah terus yaa 🥺
    </h1>

    <p>
      semoga setelah baca ini mood kamu jadi lebih baik yaa.🌷
    </p>

    <button onclick="showMessage()">Klik kalau lagi ngambek 😔</button>

    <div class="popup" id="popup">
      Aku sayang kamu bebee <span class="heart">❤</span><br><br>
    </div>
  </div>

  <script>
    function showMessage() {
      document.getElementById('popup').classList.toggle('show');
    }
  </script>
</body>
</html>
